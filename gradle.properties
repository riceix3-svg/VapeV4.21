org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8

# Build the consolidated payload for Minecraft 1.21.11 by default. Modern
# Minecraft 1.21.x runs on Java 21, so emit Java 21 bytecode unless overridden
# per-invocation with -PtargetRelease=<n> for older compatibility experiments.
targetRelease=21
targetMinecraftVersion=1.21.11
