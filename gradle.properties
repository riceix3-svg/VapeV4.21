org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8

# Build the consolidated payload for Minecraft 1.21.11 by default while
# keeping Java 8 bytecode for broad loader compatibility. Java 8 class files
# load on the Java 21 runtime used by modern Minecraft. Override per-invocation
# with -PtargetRelease=<n> for compatibility experiments.
targetRelease=8
targetMinecraftVersion=1.21.11
